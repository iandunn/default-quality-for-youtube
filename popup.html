<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Default Quality for YouTube</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<main>
		<label for="quality">Default quality</label>

		<select id="quality">
			<option value="auto">Auto</option>
			<option value="highres">4320p</option>
			<option value="hd2160">2160p</option>
			<option value="hd1440">1440p</option>
			<option value="hd1080">1080p</option>
			<option value="hd720">720p</option>
			<option value="large">480p</option>
			<option value="medium">360p</option>
			<option value="small">240p</option>
			<option value="tiny">144p</option>
		</select>

		<p>Applies to every video.</p>
	</main>

	<script type="module" src="popup.js"></script>
</body>
</html>
