<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b57d0}a:hover{color:#041e49}
</style>
</helmet>
<div style="width: 260px; height: 470px; box-sizing: border-box; padding: 8px 0; display: flex; flex-direction: column; background: #ffffff; color: #1f1f1f; font-family: system-ui, -apple-system, sans-serif;">
<h1 style="margin: 0; padding: 10px 16px 8px; font-size: 12px; font-weight: 500; color: #474747;">Default quality</h1>
<sc-for list="{{items}}" as="item" hint-placeholder-count="10">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="{{item.rowStyle}}">
<span style="width: 20px; height: 20px; display: flex;">
<sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 -960 960 960" fill="#0b57d0" aria-hidden="true"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"></path></svg>
</sc-if>
</span>
<span>{{item.label}}</span>
</button>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":260,"height":470}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || '1080p';
const labels = ['Auto', '4320p', '2160p', '1440p', '1080p', '720p', '480p', '360p', '240p', '144p'];
const base = 'display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 16px; border: 0; font: inherit; font-size: 14px; text-align: left; cursor: pointer; color: #1f1f1f;';
return {
items: labels.map((label) => ({
label: label,
selected: label === picked,
pressed: label === picked ? 'true' : 'false',
rowStyle: base + (label === picked ? ' background: #d3e3fd; color: #041e49;' : ' background: transparent;'),
pick: () => this.setState({ picked: label })
}))
};
}
}
</script>
</body>
</html>
