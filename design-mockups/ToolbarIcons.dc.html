<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar icon options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b57d0}a:hover{color:#041e49}
</style>
</helmet>
<div style="width: 600px; height: 480px; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; background: #ffffff; color: #1f1f1f; font-family: system-ui, -apple-system, sans-serif;">
<div style="display: grid; grid-template-columns: 200px repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #c4c7c5; font-size: 12px; font-weight: 500; color: #474747;">
<span>Icon</span>
<span>Light toolbar, 16px</span>
<span>Dark toolbar, 16px</span>
<span>Store / settings, 32px</span>
</div>
<sc-for list="{{icons}}" as="icon" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 200px repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; height: 48px; border-bottom: 1px solid #e3e3e3;">
<div style="display: flex; flex-direction: column; gap: 1px;">
<span style="font-size: 13px;">{{icon.name}}</span>
<span style="font-size: 11px; color: #474747;">{{icon.source}}</span>
</div>
<div style="width: 112px; height: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 10px; box-sizing: border-box; border-radius: 16px; background: #f0f4f9;">
<span style="width: 16px; height: 16px; border-radius: 8px; background: #c4c7c5;"></span>
<svg width="16" height="16" viewBox="{{icon.viewBox}}" fill="{{icon.fill}}" stroke="{{icon.stroke}}" stroke-width="{{icon.strokeWidth}}" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{icon.name}}"><path d="{{icon.path}}"></path></svg>
</div>
<div style="width: 112px; height: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 10px; box-sizing: border-box; border-radius: 16px; background: #282a2c;">
<span style="width: 16px; height: 16px; border-radius: 8px; background: #5e5e5e;"></span>
<svg width="16" height="16" viewBox="{{icon.viewBox}}" fill="{{icon.fill}}" stroke="{{icon.stroke}}" stroke-width="{{icon.strokeWidth}}" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{icon.name}}"><path d="{{icon.path}}"></path></svg>
</div>
<svg width="32" height="32" viewBox="{{icon.viewBox}}" fill="{{icon.fill}}" stroke="{{icon.stroke}}" stroke-width="{{icon.strokeWidth}}" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{icon.name}}"><path d="{{icon.path}}"></path></svg>
</div>
</sc-for>
</div>
</x-dc>
