<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native minimal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1a5fb4}a:hover{color:#0d3a73}
</style>
</helmet>
<div style="width: 280px; height: 150px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #ffffff; color: #1f1f1f; font-family: system-ui, -apple-system, sans-serif;">
<label for="quality" style="font-size: 13px; font-weight: 600;">Default quality</label>
<select id="quality" style="font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #747775; border-radius: 8px; background: #ffffff; color: #1f1f1f;">
<option>Auto</option>
<option>4320p</option>
<option>2160p</option>
<option>1440p</option>
<option selected="selected">1080p</option>
<option>720p</option>
<option>480p</option>
<option>360p</option>
<option>240p</option>
<option>144p</option>
</select>
<p style="margin: 0; font-size: 12px; color: #474747;">Applies to every video.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":280,"height":150}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
