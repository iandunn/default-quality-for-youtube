<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stepper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b57d0}a:hover{color:#041e49}
</style>
</helmet>
<div style="width: 260px; height: 230px; box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; background: #ffffff; color: #1f1f1f; font-family: system-ui, -apple-system, sans-serif;">
<h1 style="margin: 0; align-self: flex-start; font-size: 14px; font-weight: 500;">Default quality</h1>
<div style="display: flex; align-items: center; gap: 16px;">
<button type="button" aria-label="Lower quality" onClick="{{down}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #747775; border-radius: 22px; background: #ffffff; color: #1f1f1f; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<output style="min-width: 96px; text-align: center; font-size: 36px; font-weight: 500; color: #0b57d0;">{{current}}</output>
<button type="button" aria-label="Higher quality" onClick="{{up}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #747775; border-radius: 22px; background: #ffffff; color: #1f1f1f; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15"></path></svg>
</button>
</div>
<p style="margin: 0; font-size: 12px; color: #474747;">{{tier}}</p>
<button type="button" style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 0; border-radius: 16px; background: #f0f4f9; color: #1f1f1f; font: inherit; font-size: 13px; cursor: pointer;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"></path></svg>
Use Auto instead
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":260,"height":230}}'>
class Component extends DCLogic {
renderVals() {
const steps = ['144p', '240p', '360p', '480p', '720p', '1080p', '1440p', '2160p', '4320p'];
const tiers = ['Lowest', 'Low', 'SD', 'SD', 'HD', 'Full HD', 'QHD', '4K', '8K'];
const index = (this.state && this.state.index != null) ? this.state.index : 5;
return {
current: steps[index],
tier: tiers[index],
down: () => this.setState({ index: Math.max(0, index - 1) }),
up: () => this.setState({ index: Math.min(steps.length - 1, index + 1) })
};
}
}
</script>
</body>
</html>
